<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel de Produção">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Painel de Produção</title>

<style>
/* =========================
   BASE
========================= */
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#1b1b1b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */
header {
  background:#111;
  padding:10px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  position:relative;
}

/* =========================
   LOGIN
========================= */
#loginOverlay {
  position: fixed;
  inset: 0;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login-box {
  background: #222;
  padding: 25px;
  border-radius: 16px;
  width: 300px;
  text-align: center;
}

.usuarios.avatars {
  display:flex;
  gap:14px;
  margin-bottom:20px;
}

.avatar {
  flex:1;
  background:#333;
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
  cursor:pointer;
  opacity:.5;
}

.avatar img {
  width:56px;
  height:56px;
  border-radius:50%;
}

.avatar span {
  display:block;
  margin-top:6px;
  font-weight:bold;
  font-size:13px;
}

.avatar.ativo {
  opacity:1;
  outline:2px solid #ffca28;
}

/* =========================
   PIN
========================= */
.pin {
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:15px;
}
.pin span {
  width:14px;
  height:14px;
  background:#555;
  border-radius:50%;
}
.pin span.filled { background:#fff; }

/* =========================
   KEYPAD
========================= */
.keypad {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.keypad button {
  height:48px;
  font-size:18px;
  border-radius:10px;
  border:none;
  background:#333;
  color:white;
  font-weight:bold;
}
.keypad .clear { background:#c62828; }
.keypad .ok { background:#2e7d32; }

/* =========================
   MODOS
========================= */
.modos {
  display:flex;
  gap:6px;
  padding:6px;
  background:#222;
}
.modos button {
  flex:1;
  height:40px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  opacity:.5;
}
.modos .ativo { opacity:1; }
.fila { background:#555; }
.encomenda { background:#ffca28; color:#000; }
.senha { background:#ab47bc; }

/* =========================
   BOTÕES
========================= */
.botoes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
}
button {
  height:50px;
  font-size:14px;
  font-weight:bold;
  border-radius:12px;
  border:none;
  color:white;
}
.carne { background:#e53935; }
.peixe { background:#1e88e5; }
.veg { background:#43a047; }
.opcao { background:#000; }
.take { border:2px dashed rgba(255,255,255,.6); }

/* =========================
   PAINEL
========================= */
.painel {
  flex:1;
  display:flex;
  gap:6px;
  padding:6px;
}
.coluna {
  flex:1;
  background:#2a2a2a;
  border-radius:10px;
  padding:6px;
}
.coluna h2 {
  text-align:center;
  font-size:16px;
}
.pedido {
  height:38px;
  margin-bottom:4px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* =========================
   EXCLUIR
========================= */
.excluir {
  position:absolute;
  right:6px;
  top:6px;
  cursor:pointer;
}

/* =========================
   MODAL OPÇÕES
========================= */
#modalOpcao {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#modalOpcao .box {
  background:#222;
  padding:20px;
  border-radius:14px;
  width:260px;
  text-align:center;
}

#modalOpcao button {
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn-frango { background:#ff7043; }
.btn-omelete { background:#ffd54f; color:#000; }
.btn-hamb { background:#8d6e63; }
.btn-cancelar { background:#555; }
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 Acesso</h2>

    <div class="usuarios avatars">
      <div class="avatar" onclick="selecionarUsuario('balcao',this)">
        <img src="avatars/balcao.png"><span>Balcão</span>
      </div>
      <div class="avatar" onclick="selecionarUsuario('cozinha',this)">
        <img src="avatars/cozinha.png"><span>Cozinha</span>
      </div>
      <div class="avatar" onclick="selecionarUsuario('admin',this)">
        <img src="avatars/admin.png"><span>Admin</span>
      </div>
    </div>

    <div class="pin">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="clear">C</button>
      <button>0</button>
      <button class="ok">✔</button>
    </div>
    <p id="loginErro"></p>
  </div>
</div>

<header>
🍽️ PAINEL DE PRODUÇÃO
</header>

<div class="modos">
<button class="fila ativo" onclick="setModo('fila',this)">FILA</button>
<button class="encomenda" onclick="setModo('encomenda',this)">ENCOMENDA</button>
<button class="senha" onclick="setModo('senha',this)">SENHA</button>
</div>

<div class="botoes">
<button class="carne" onclick="novoPedido('carne',false)">CARNE</button>
<button class="carne take" onclick="novoPedido('carne',true)">CARNE + TAKE</button>

<button class="peixe" onclick="novoPedido('peixe',false)">PEIXE</button>
<button class="peixe take" onclick="novoPedido('peixe',true)">PEIXE + TAKE</button>

<button class="veg" onclick="novoPedido('veg',false)">VEG</button>
<button class="veg take" onclick="novoPedido('veg',true)">VEG + TAKE</button>

<button class="opcao" onclick="abrirModalOpcao(false)">OPÇÕES</button>
<button class="opcao take" onclick="abrirModalOpcao(true)">OPÇÕES + TAKE</button>
</div>

<div class="painel">
  <div class="coluna" id="preparo"><h2>👨‍🍳 EM PREPARO</h2></div>
  <div class="coluna" id="pronto"><h2>✅ PRONTO</h2></div>
</div>

<!-- MODAL OPÇÕES -->
<div id="modalOpcao">
  <div class="box">
    <h3>Escolha a opção</h3>
    <button class="btn-frango" onclick="confirmarOpcao('frango')">Frango</button>
    <button class="btn-omelete" onclick="confirmarOpcao('omelete')">Omelete</button>
    <button class="btn-hamb" onclick="confirmarOpcao('hamburguer')">Hambúrguer</button>
    <button class="btn-cancelar" onclick="fecharModalOpcao()">Cancelar</button>
  </div>
</div>

<script>
/* =========================
   MODAL OPÇÕES
========================= */
let opcaoTakeTemp = false;

function abrirModalOpcao(take) {
  opcaoTakeTemp = take;
  document.getElementById('modalOpcao').style.display='flex';
}

function fecharModalOpcao() {
  document.getElementById('modalOpcao').style.display='none';
}

function confirmarOpcao(tipoOpcao) {
  novoPedido('opcao', opcaoTakeTemp, tipoOpcao);
  fecharModalOpcao();
}

/* =========================
   PEDIDOS
========================= */
let modo='fila';

function setModo(m,b){
  modo=m;
  document.querySelectorAll('.modos button').forEach(x=>x.classList.remove('ativo'));
  b.classList.add('ativo');
}

function novoPedido(tipo, take, opcaoTipo=null) {
  if (window.firebaseDB) {
    window.firebaseDB.criarPedido(tipo, take, opcaoTipo);
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = { /* SEU CONFIG */ };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pedidosRef = ref(db,'pedidos');

function criarPedido(tipo,take,opcaoTipo){
  const r = push(pedidosRef);
  set(r,{
    tipo,
    take,
    opcaoTipo,
    modo,
    status:'preparo',
    criadoEm:Date.now()
  });
}

onValue(pedidosRef,snap=>{
  preparo.innerHTML='<h2>👨‍🍳 EM PREPARO</h2>';
  pronto.innerHTML='<h2>✅ PRONTO</h2>';
  snap.forEach(s=>{
    const p=s.val();
    const d=document.createElement('div');
    d.className='pedido';
    let label=p.tipo.toUpperCase();
    if(p.opcaoTipo) label+=` (${p.opcaoTipo.toUpperCase()})`;
    if(p.take) label+=' + TAKE';
    d.innerText=label;
    (p.status==='preparo'?preparo:pronto).appendChild(d);
  });
});

window.firebaseDB={db,ref,set,push,remove,criarPedido};
</script>

</body>
</html>
