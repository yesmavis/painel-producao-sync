<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel de Production">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link class="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Painel de Produção</title>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#1b1b1b;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  background:#111;
  padding:10px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  position:relative;
}

#loginOverlay {
  position: fixed;
  inset: 0;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login-box {
  background: #222;
  padding: 25px;
  border-radius: 16px;
  width: 300px;
  text-align: center;
}

.login-box h2 {
  margin-bottom: 15px;
}

.usuarios {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.usuarios button {
  flex: 1;
  height: 45px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: #444;
  color: #fff;
  opacity: .6;
}

.usuarios button.ativo {
  opacity: 1;
  outline: 2px solid #ffca28;
}

.login-box input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin: 0 auto 12px auto;
  font-size: 16px;
  text-align: center;
  display: block;
  box-sizing: border-box;
}

#loginErro {
  color: #ff5252;
  margin-top: 10px;
}

#fecharCozinha {
  position:absolute;
  right:10px;
  top:10px;
  border:1px solid #555;
  background:transparent;
  color:#bbb;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
}

#logoutBtn {
  position: absolute;
  left: 10px;
  top: 10px;
  border: 1px solid #555;
  background: transparent;
  color: #bbb;
  padding: 6px 12px;
  border-radius: 10px;
  cursor: pointer;
}

#logoutBtn:hover {
  background: #333;
}

.pin {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.pin span {
  width: 14px;
  height: 14px;
  background: #555;
  border-radius: 50%;
}

.pin span.filled {
  background: #fff;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}

.keypad button {
  height: 48px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  background: #333;
  color: white;
  font-weight: bold;
}

.keypad .clear {
  background: #c62828;
}

.keypad .ok {
  background: #2e7d32;
}

.modos {
  display:flex;
  gap:6px;
  padding:6px;
  background:#222;
}

.modos button {
  flex:1;
  height:40px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  opacity:.5;
}

.modos .ativo { opacity:1; }

.fila { background:#555; }
.encomenda { background:#ffca28; color:#000; }
.senha { background:#ab47bc; }
.delivery { background:#ffffff; color:#000000; }

.contadores {
  display:flex;
  justify-content:space-around;
  background:#222;
  padding:6px;
  font-size:14px;
}

.painel-ajuste-estoque {
  display: none;
  justify-content: space-around;
  background: #151515;
  padding: 8px 6px;
  gap: 8px;
  border-bottom: 1px solid #333;
}
.btn-ajuste {
  flex: 1;
  height: 38px;
  font-size: 13px;
  font-weight: bold;
  border-radius: 8px;
  border: none;
  color: white;
  cursor: pointer;
}

.botoes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
}

button {
  height:50px;
  font-size:14px;
  font-weight:bold;
  border-radius:12px;
  border:none;
  color:white;
  cursor: pointer;
}

button:disabled {
  background: #444 !important;
  color: #777 !important;
  border: 1px dashed #555 !important;
  cursor: not-allowed;
  opacity: 0.6;
}

.opcao-btn {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 12px;
  border: none;
  background: #000;
  color: #fff;
  font-weight: bold;
}

.cancelar {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  background: #444;
  color: #fff;
  border: none;
  border-radius: 12px;
}

.carne { background:#e53935; }
.peixe { background:#1e88e5; }
.veg { background:#43a047; }
.opcao { background:#000; border: 1px solid #444; }

.take {
  border:2px dashed rgba(255,255,255,.6);
}

.painel {
  flex:1;
  display:flex;
  gap:6px;
  padding:6px;
}

.coluna {
  flex:1;
  background:#2a2a2a;
  border-radius:10px;
  padding:6px;
}

.coluna h2 {
  text-align:center;
  font-size:16px;
  margin:4px 0;
}

.pedido {
  height:38px;
  margin-bottom:4px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:var(--base-color);
}

.pedido.encomenda {
  background: linear-gradient(to right, #ffca28 0%, #ffca28 33%, transparent 33%), var(--base-color);
}
.pedido.senha {
  background: linear-gradient(to right, #ab47bc 0%, #ab47bc 33%, transparent 33%), var(--base-color);
}
.pedido.delivery {
  background: linear-gradient(to right, #ffffff 0%, #ffffff 33%, transparent 33%), var(--base-color);
  color: #000000;
}

.pedido.encomenda.opcao, .pedido.delivery.opcao {
  color: #fff;
}

.excluir {
  position:absolute;
  right:6px;
  top:6px;
  font-size:16px;
  cursor:pointer;
}

#resumo {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index: 10000;
}

#resumo .box {
  background:#222;
  padding:25px;
  border-radius:15px;
  width:320px;
  text-align:center;
}

#resumo .box button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#resumo .btn-pdf { background: #1e88e5; color: #fff; }
#resumo .btn-encerrar { background: #e53935; color: #fff; }

.usuarios.avatars {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
}

.avatar {
  flex: 1;
  background: #333;
  border-radius: 14px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.2s ease;
}

.avatar img {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  margin-bottom: 6px;
}

.avatar span {
  display: block;
  font-size: 13px;
  font-weight: bold;
}

.avatar.ativo {
  opacity: 1;
  outline: 2px solid #ffca28;
}

#modalEstoqueInicial {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
}
#modalEstoqueInicial .box-estoque {
  background: #222;
  padding: 25px;
  border-radius: 16px;
  width: 290px;
  text-align: center;
}
#modalEstoqueInicial label {
  display: block;
  text-align: left;
  font-size: 13px;
  margin-top: 10px;
  color: #bbb;
}
#modalEstoqueInicial input {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  border-radius: 8px;
  border: none;
  background: #333;
  color: #fff;
  font-size: 16px;
  text-align: center;
  box-sizing: border-box;
}
#modalEstoqueInicial button {
  width: 100%;
  margin-top: 18px;
  background: #2e7d32;
  height: 45px;
}
</style>
</head>

<body>
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 Acesso ao Sistema</h2>
    <div class="usuarios avatars">
      <div class="avatar" onclick="selecionarUsuario('balcao', this)">
        <img src="avatars/balcao.png" alt="Balcão">
        <span>Balcão</span>
      </div>
      <div class="avatar" onclick="selecionarUsuario('cozinha', this)">
        <img src="avatars/cozinha.png" alt="Cozinha">
        <span>Cozinha</span>
      </div>
      <div class="avatar" onclick="selecionarUsuario('admin', this)">
        <img src="avatars/admin.png" alt="Admin">
        <span>Admin</span>
      </div>
    </div>
    <div class="pin">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="keypad">
      <button onclick="pressPin('1')">1</button><button onclick="pressPin('2')">2</button><button onclick="pressPin('3')">3</button>
      <button onclick="pressPin('4')">4</button><button onclick="pressPin('5')">5</button><button onclick="pressPin('6')">6</button>
      <button onclick="pressPin('7')">7</button><button onclick="pressPin('8')">8</button><button onclick="pressPin('9')">9</button>
      <button class="clear" onclick="pressPin('C')">C</button>
      <button onclick="pressPin('0')">0</button>
      <button class="ok" onclick="pressPin('✔')">✔</button>
    </div>
    <p id="loginErro"></p>
  </div>
</div>

<div id="modalEstoqueInicial">
  <div class="box-estoque">
    <h3>📈 Iniciar Doses do Turno</h3>
    <p style="font-size:12px; color:#aaa; margin-top:-8px;">Definido uma vez por turno</p>
    
    <label>🔴 Limite de Carne:</label>
    <input type="number" id="initCarne" value="20" min="0">

    <label>🟦 Limite de Peixe:</label>
    <input type="number" id="initPeixe" value="20" min="0">

    <label>🟩 Limite de Veg:</label>
    <input type="number" id="initVeg" value="10" min="0">

    <button onclick="salvarEstoqueInicial()">🚀 Salvar e Iniciar Turno</button>
  </div>
</div>

<header>
🍽️ PAINEL DE PRODUÇÃO
<button id="logoutBtn" onclick="logout()">🚪 Sair</button>
<button id="fecharCozinha" onclick="confirmarFecho()">Fechar Cozinha</button>
</header>

<div class="modos">
<button class="fila ativo" onclick="setModo('fila',this)">🧍 FILA</button>
<button class="encomenda" onclick="setModo('encomenda',this)">📦 ENCOMENDA</button>
<button class="delivery" onclick="setModo('delivery',this)">🛵 DELIVERY</button>
<button class="senha" onclick="setModo('senha',this)">🎫 SENHA</button>
</div>

<div class="contadores">
🔴 <span id="cCarne">0 / 0</span>
🟦 <span id="cPeixe">0 / 0</span>
🟩 <span id="cVeg">0 / 0</span>
⚫ <span id="cOpcao">0</span>
</div>

<div class="painel-ajuste-estoque" id="painelAjusteEstoque">
  <button class="btn-ajuste carne" onclick="adicionarDoseManual('carne')">+1 Carne</button>
  <button class="btn-ajuste peixe" onclick="adicionarDoseManual('peixe')">+1 Peixe</button>
  <button class="btn-ajuste veg" onclick="adicionarDoseManual('veg')">+1 Veg</button>
  <button class="btn-ajuste opcao" onclick="adicionarDoseManual('opcao')">+1 Opção</button>
</div>

<div class="botoes">
<button class="carne" id="btn_carne" onclick="novoPedido('carne', false)">CARNE</button>
<button class="carne take" id="btn_carne_take" onclick="novoPedido('carne', true)">CARNE + TAKE</button>

<button class="peixe" id="btn_peixe" onclick="novoPedido('peixe', false)">PEIXE</button>
<button class="peixe take" id="btn_peixe_take" onclick="novoPedido('peixe', true)">PEIXE + TAKE</button>

<button class="veg" id="btn_veg" onclick="novoPedido('veg', false)">VEG</button>
<button class="veg take" id="btn_veg_take" onclick="novoPedido('veg', true)">VEG + TAKE</button>

<button class="opcao" id="btn_opcao" onclick="abrirModalOpcoes(false)">OPÇÕES</button>
<button class="opcao take" id="btn_opcao_take" onclick="abrirModalOpcoes(true)">OPÇÕES + TAKE</button>
</div>

<div class="painel">
  <div class="coluna" id="preparo"><h2>👨‍🍳 EM PREPARO</h2></div>
  <div class="coluna" id="pronto"><h2>✅ PRONTO</h2></div>
</div>

<div id="resumo">
  <div class="box">
    <h2>📊 Resumo do Turno</h2>
    <p>🔴 Carne: <strong id="rCarne"></strong><br><small>Take: <strong id="rCarneTake"></strong></small></p>
    <p>🟦 Peixe: <strong id="rPeixe"></strong><br><small>Take: <strong id="rPeixeTake"></strong></small></p>
    <p>🟩 Veg: <strong id="rVeg"></strong><br><small>Take: <strong id="rVegTake"></strong></small></p>
    <p>⚫ Opções: <strong id="rOpcao"></strong><br><small>Take: <strong id="rOpcaoTake"></strong></small></p>
    <p><strong>TOTAL SELECIONADO: <span id="rTotal"></span></strong></p>
    <button class="btn-pdf" onclick="gerarPDFResumo()">📄 Baixar PDF</button>
    <button class="btn-encerrar" onclick="confirmarReiniciarTurno()">⏹ Encerrar e reiniciar</button>
  </div>
</div>

<div id="modalOpcoes" style="position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 9999;">
  <div style="background: #1e1e1e; padding: 20px; border-radius: 16px; width: 280px; text-align: center;">
    <h3>Escolha a opção</h3>
    <button class="opcao-btn" onclick="confirmarOpcao('Frango')">🍗 Frango</button>
    <button class="opcao-btn" onclick="confirmarOpcao('Omelete')">🍳 Omelete</button>
    <button class="opcao-btn" onclick="confirmarOpcao('Hambúrguer')">🍔 Hambúrguer</button>
    <button onclick="fecharModalOpcoes()" class="cancelar">Cancelar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const RESTAURANTE = 'Cafetaria Blend - Vila Real';
const VERSAO_APP = '1.0.8';
const LOCALE = 'en-US';
const SENHA_FECHO = '0001';

const SENHAS = { balcao: '1111', cozinha: '2222', admin: '9999' };
let usuarioSelecionado = null;
let pin = [];
let modo = 'fila';
const estoqueInicial = { carne: 0, peixe: 0, veg: 0, opcao: 9999 };

const cont = {
  carne: 0, peixe: 0, veg: 0, opcao: 0,
  take: { carne: 0, peixe: 0, veg: 0, opcao: 0 },
  origem: {
    fila: { carne: 0, peixe: 0, veg: 0, opcao: 0 },
    encomenda: { carne: 0, peixe: 0, veg: 0, opcao: 0 },
    senha: { carne: 0, peixe: 0, veg: 0, opcao: 0 },
    delivery: { carne: 0, peixe: 0, veg: 0, opcao: 0 }
  }
};

let ultimoResumoTurno = null;
let estaConfiguradoFirebase = false; 

function getRole() { return localStorage.getItem('usuario_role'); }
function selecionarUsuario(role, el) {
  usuarioSelecionado = role;
  document.querySelectorAll('.avatar').forEach(a => a.classList.remove('ativo'));
  el.classList.add('ativo');
}

function pressPin(v) {
  if (v === 'C') { pin = []; } 
  else if (v === '✔') { fazerLogin(); return; } 
  else if (pin.length < 4) { pin.push(v); }
  atualizarPin();
}

function atualizarPin() {
  document.querySelectorAll('.pin span').forEach((dot, i) => {
    dot.classList.toggle('filled', !!pin[i]);
  });
}

function fazerLogin() {
  const erro = document.getElementById('loginErro');
  const senha = pin.join('');

  if (!usuarioSelecionado) { erro.innerText = 'Selecione um usuário'; return; }
  if (senha.length !== 4) { erro.innerText = 'Digite os 4 números'; return; }

  if (senha !== SENHAS[usuarioSelecionado]) {
    erro.innerText = 'Senha incorreta';
    pin = []; atualizarPin(); return;
  }

  localStorage.setItem('usuario_role', usuarioSelecionado);
  document.getElementById('loginOverlay').style.display = 'none';
  pin = []; atualizarPin(); erro.innerText = '';

  aplicarPermissoes();
  verificarExibicaoEstoqueModal();
}

function aplicarPermissoes() {
  const role = getRole();
  document.getElementById('fecharCozinha').style.display = (role === 'cozinha' || role === 'admin') ? 'block' : 'none';
  document.getElementById('logoutBtn').style.display = role ? 'block' : 'none';
  document.getElementById('painelAjusteEstoque').style.display = (role === 'cozinha' || role === 'admin') ? 'flex' : 'none';
}

function logout() {
  if (!confirm('Deseja sair do sistema?')) return;
  localStorage.removeItem('usuario_role');
  usuarioSelecionado = null; pin = []; atualizarPin();
  document.getElementById('loginErro').innerText = '';
  document.querySelectorAll('.avatar').forEach(b => b.classList.remove('ativo'));
  document.getElementById('loginOverlay').style.display = 'flex';
  aplicarPermissoes();
}

function setModo(m, b) {
  modo = m;
  document.querySelectorAll('.modos button').forEach(x => x.classList.remove('ativo'));
  b.classList.add('ativo');
}

function verificarExibicaoEstoqueModal() {
  const role = getRole();
  const modal = document.getElementById('modalEstoqueInicial');
  if (!role) return;

  if (!estaConfiguradoFirebase) {
    if (role === 'cozinha' || role === 'admin') {
      modal.style.display = 'flex';
    } else {
      modal.style.display = 'none';
    }
  } else {
    modal.style.display = 'none';
  }
}

function atualizar() {
  const restCarne = Math.max(0, estoqueInicial.carne - cont.carne);
  const restPeixe = Math.max(0, estoqueInicial.peixe - cont.peixe);
  const restVeg = Math.max(0, estoqueInicial.veg - cont.veg);

  document.getElementById('cCarne').innerText = `${restCarne} / ${estoqueInicial.carne}`;
  document.getElementById('cPeixe').innerText = `${restPeixe} / ${estoqueInicial.peixe}`;
  document.getElementById('cVeg').innerText = `${restVeg} / ${estoqueInicial.veg}`;
  document.getElementById('cOpcao').innerText = `${cont.opcao}`;

  const role = getRole();
  const podePedir = (role === 'balcao' || role === 'admin');

  // Os botões só bloqueiam se restCarne/restPeixe/restVeg forem 0 E o estoque total inicial for de fato 0
  document.getElementById('btn_carne').disabled = !podePedir || (estoqueInicial.carne > 0 && restCarne <= 0);
  document.getElementById('btn_carne_take').disabled = !podePedir || (estoqueInicial.carne > 0 && restCarne <= 0);
  document.getElementById('btn_peixe').disabled = !podePedir || (estoqueInicial.peixe > 0 && restPeixe <= 0);
  document.getElementById('btn_peixe_take').disabled = !podePedir || (estoqueInicial.peixe > 0 && restPeixe <= 0);
  document.getElementById('btn_veg').disabled = !podePedir || (estoqueInicial.veg > 0 && restVeg <= 0);
  document.getElementById('btn_veg_take').disabled = !podePedir || (estoqueInicial.veg > 0 && restVeg <= 0);
  document.getElementById('btn_opcao').disabled = !podePedir;
  document.getElementById('btn_opcao_take').disabled = !podePedir;
}

let opcaoTakeSelecionado = false;
function abrirModalOpcoes(isTake) {
  opcaoTakeSelecionado = isTake;
  document.getElementById('modalOpcoes').style.display = 'flex';
}
function fecharModalOpcoes() { document.getElementById('modalOpcoes').style.display = 'none'; }
function confirmarOpcao(nome) { fecharModalOpcoes(); novoPedido('opcao', opcaoTakeSelecionado, nome); }

function novoPedido(tipo, take, opcaoTipo = null) {
  if (window.firebaseDB && window.firebaseDB.criarPedido) {
    window.firebaseDB.criarPedido(tipo, take, opcaoTipo);
  }
}

function adicionarDoseManual(tipo) {
  if (window.firebaseDB && window.firebaseDB.atualizarEstoqueFirebase) {
    if (tipo === 'opcao') {
      window.firebaseDB.atualizarEstoqueFirebase(tipo, 9999); 
    } else {
      const valorAtual = estoqueInicial[tipo] || 0;
      window.firebaseDB.atualizarEstoqueFirebase(tipo, valorAtual + 1);
    }
  }
}

function salvarEstoqueInicial() {
  const c = parseInt(document.getElementById('initCarne').value) || 0;
  const p = parseInt(document.getElementById('initPeixe').value) || 0;
  const v = parseInt(document.getElementById('initVeg').value) || 0;

  // 1. Atualiza imediatamente o estado local da app para evitar "delay" visual
  estoqueInicial.carne = c;
  estoqueInicial.peixe = p;
  estoqueInicial.veg = v;
  estaConfiguradoFirebase = true;

  document.getElementById('modalEstoqueInicial').style.display = 'none';
  atualizar();

  // 2. Dispara e guarda no Firebase
  if (window.firebaseDB && window.firebaseDB.configurarEstoqueInicialFirebase) {
    window.firebaseDB.configurarEstoqueInicialFirebase(c, p, v, 9999);
  }
}

function renderPedido(id, pedido) {
  const { tipo, take, status, opcaoTipo } = pedido;
  if (status === 'finalizado') return;

  const cores = { carne: '#e53935', peixe: '#1e88e5', veg: '#43a047', opcao: '#000' };
  const nomes = { carne: 'CARNE', peixe: 'PEIXE', veg: 'VEG', opcao: 'OPÇÕES' };

  const p = document.createElement('div');
  p.className = `pedido ${pedido.modo || 'fila'} ${tipo}` + (take ? ' take' : '');
  p.style.setProperty('--base-color', cores[tipo]);
  p.dataset.id = id;
  let texto = nomes[tipo];

  if (tipo === 'opcao' && opcaoTipo) texto += ` (${opcaoTipo})`;
  if (take) texto += ' + TAKE';
  p.innerText = texto;

  const role = getRole();
  if (role === 'balcao' || role === 'admin') {
    const del = document.createElement('span');
    del.className = 'excluir';
    del.innerText = '❌';
    del.onclick = (e) => {
      e.stopPropagation();
      const pedidoRef = window.firebaseDB.ref(window.firebaseDB.db, 'pedidos/' + id);
      window.firebaseDB.remove(pedidoRef);
    };
    p.appendChild(del);
  }
  
  p.onclick = () => {
    let novoStatus = null;
    if (pedido.status === 'preparo' && (role === 'cozinha' || role === 'admin')) {
      novoStatus = 'pronto';
    } else if (pedido.status === 'pronto' && (role === 'balcao' || role === 'admin')) {
      novoStatus = 'finalizado';
    }
    if (!novoStatus) return;
    const pedidoRef = window.firebaseDB.ref(window.firebaseDB.db, 'pedidos/' + id);
    window.firebaseDB.set(pedidoRef, { ...pedido, status: novoStatus });
  };

  if (status === 'preparo') preparo.appendChild(p);
  else if (status === 'pronto') pronto.appendChild(p);
}

function confirmarFecho() {
  const senha = prompt('🔐 Digite a senha para fechar a cozinha:');
  if (senha === SENHA_FECHO) fecharCozinha();
  else if (senha !== null) alert('❌ Senha incorreta!');
}

async function fecharCozinha() {
  ultimoResumoTurno = {
    carne: cont.carne, peixe: cont.peixe, veg: cont.veg, opcao: cont.opcao,
    take: { carne: cont.take.carne, peixe: cont.take.peixe, veg: cont.take.veg, opcao: cont.take.opcao },
    origem: JSON.parse(JSON.stringify(cont.origem)),
    total: cont.carne + cont.peixe + cont.veg + cont.opcao,
    encerradoEm: Date.now(),
    encerradoEmTexto: new Date().toLocaleString(LOCALE)
  };

  document.getElementById('rCarne').innerText = ultimoResumoTurno.carne;
  document.getElementById('rPeixe').innerText = ultimoResumoTurno.peixe;
  document.getElementById('rVeg').innerText = ultimoResumoTurno.veg;
  document.getElementById('rOpcao').innerText = ultimoResumoTurno.opcao;
  document.getElementById('rCarneTake').innerText = ultimoResumoTurno.take.carne;
  document.getElementById('rPeixeTake').innerText = ultimoResumoTurno.take.peixe;
  document.getElementById('rVegTake').innerText = ultimoResumoTurno.take.veg;
  document.getElementById('rOpcaoTake').innerText = ultimoResumoTurno.take.opcao;
  document.getElementById('rTotal').innerText = ultimoResumoTurno.total;
  
  document.getElementById('resumo').style.display = 'flex';

  try {
    await window.firebaseDB.push(window.firebaseDB.ref(window.firebaseDB.db, 'relatorios'), ultimoResumoTurno);
    await window.firebaseDB.remove(window.firebaseDB.ref(window.firebaseDB.db, 'pedidos'));
  } catch (e) { console.error(e); }
}

async function confirmarReiniciarTurno() {
  if (window.firebaseDB && window.firebaseDB.limparEstoqueTurno) {
    try {
      await window.firebaseDB.limparEstoqueTurno();
      localStorage.removeItem('usuario_role');
      window.location.href = window.location.origin + window.location.pathname + '?r=' + Date.now();
    } catch (e) { localStorage.removeItem('usuario_role'); window.location.reload(); }
  }
}

function gerarPDFResumo() {
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  doc.text(RESTAURANTE, 10, 10);
  doc.text(`Total de pratos: ${ultimoResumoTurno.total}`, 10, 20);
  doc.save('resumo.pdf');
}

document.addEventListener('DOMContentLoaded', () => {
  const role = getRole();
  if (role) {
    document.getElementById('loginOverlay').style.display = 'none';
    aplicarPermissoes();
  }
});
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCms7tcWbslK-d0WZ6g8lFr_eicNaz4Dp4",
    authDomain: "painel-producao-sync.firebaseapp.com",
    databaseURL: "https://painel-producao-sync-default-rtdb.firebaseio.com",
    projectId: "painel-producao-sync",
    storageBucket: "painel-producao-sync.firebasestorage.app",
    messagingSenderId: "563084163424",
    appId: "1:563084163424:web:274866215bb7b2faf7c605"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  signInAnonymously(auth).catch(console.error);
  onAuthStateChanged(auth, (user) => { if (user) iniciarFirebase(); });

  function iniciarFirebase() {
    const pedidosRef = ref(db, 'pedidos');
    const estoqueRef = ref(db, 'configEstoque');

    window.firebaseDB = {
      db, ref, set, push, onValue, remove, pedidosRef,
      criarPedido: (tipo, take, opcaoTipo) => {
        push(pedidosRef, { tipo, take, opcaoTipo, modo, status: 'preparo', criadoEm: Date.now() });
      },
      configurarEstoqueInicialFirebase: (c, p, v, o) => {
        set(estoqueRef, { carne: c, peixe: p, veg: v, opcao: o, definido: true });
      },
      atualizarEstoqueFirebase: (tipo, novoValor) => {
        set(ref(db, `configEstoque/${tipo}`), novoValor);
      },
      limparEstoqueTurno: () => set(estoqueRef, null)
    };

    onValue(estoqueRef, (snapshot) => {
      const data = snapshot.val();
      // Validação melhorada: se contiver propriedades numéricas válidas, aceita
      if (data && (data.definido || data.carne !== undefined)) {
        estoqueInicial.carne = data.carne !== undefined ? parseInt(data.carne) : 0;
        estoqueInicial.peixe = data.peixe !== undefined ? parseInt(data.peixe) : 0;
        estoqueInicial.veg = data.veg !== undefined ? parseInt(data.veg) : 0;
        estoqueInicial.opcao = data.opcao !== undefined ? parseInt(data.opcao) : 9999;
        estaConfiguradoFirebase = true;
      } else {
        // Se ainda não houver dados estruturados na cloud, não zera o ecrã se o admin já tiver digitado localmente
        if(!estaConfiguradoFirebase) {
           estoqueInicial.carne = 0; 
           estoqueInicial.peixe = 0; 
           estoqueInicial.veg = 0; 
           estoqueInicial.opcao = 9999;
        }
      }
      verificarExibicaoEstoqueModal();
      atualizar();
    });

    onValue(pedidosRef, (snapshot) => {
      preparo.innerHTML = '<h2>👨‍🍳 EM PREPARO</h2>';
      pronto.innerHTML = '<h2>✅ PRONTO</h2>';
      cont.carne = 0; cont.peixe = 0; cont.veg = 0; cont.opcao = 0;
      cont.take.carne = 0; cont.take.peixe = 0; cont.take.veg = 0; cont.take.opcao = 0;

      Object.keys(cont.origem).forEach(o => Object.keys(cont.origem[o]).forEach(t => cont.origem[o][t] = 0));

      const dados = snapshot.val();
      if (!dados) { atualizar(); return; }

      Object.entries(dados).sort((a,b) => (a[1].criadoEm||0)-(b[1].criadoEm||0)).forEach(([id, pedido]) => {
        cont[pedido.tipo]++;
        if (pedido.take) cont.take[pedido.tipo]++;
        if (pedido.modo && cont.origem[pedido.modo]) cont.origem[pedido.modo][pedido.tipo]++;
        renderPedido(id, pedido);
      });
      atualizar();
    });
  }
</script>
